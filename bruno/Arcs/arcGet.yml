info:
  name: arcGet
  type: http
  seq: 2
  tags:
    - Arcs

http:
  method: GET
  url: "{{baseUrl}}/v1/:lang/arcs/:idOrSlug"
  params:
    - name: lang
      value: ""
      type: path
    - name: idOrSlug
      value: ""
      type: path
    - name: asOfChapter
      value: "0"
      type: query
      description: "Spoiler filter: the last chapter read, inclusive. What the reader meets after it is left out of lists, searches and counts, and its detail answers 404. Missing: nothing is hidden"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
