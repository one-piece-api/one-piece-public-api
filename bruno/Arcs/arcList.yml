info:
  name: arcList
  type: http
  seq: 1
  tags:
    - Arcs

http:
  method: GET
  url: "{{baseUrl}}/v1/:lang/arcs"
  params:
    - name: lang
      value: ""
      type: path
    - name: page
      value: "0"
      type: query
      description: 0-based page, 0 when missing
      disabled: true
    - name: size
      value: "1"
      type: query
      description: "Page size: 20 when missing, at most 100"
      disabled: true
    - name: q
      value: ""
      type: query
      description: Text the name or the romaji or number contains, case-insensitive; 100 characters at most
      disabled: true
    - name: asOfChapter
      value: "0"
      type: query
      description: "Spoiler filter: the last chapter read, inclusive. What the reader meets after it is left out of lists, searches and counts, and its detail answers 404. What is shown reads as known then: a value or a relation not known yet is null, searches, filters and sorting use the values known then. Missing: nothing is hidden, the truth"
      disabled: true
    - name: saga
      value: ""
      type: query
      description: "Only the arcs of this saga: its id or number, an old slug included; an unknown saga lists nothing"
      disabled: true
    - name: sort
      value: number,asc
      type: query
      description: name, number or publishedAt, then asc or desc; default number,asc
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

