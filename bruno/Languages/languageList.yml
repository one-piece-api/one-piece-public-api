info:
  name: languageList
  type: http
  seq: 1
  tags:
    - Languages

http:
  method: GET
  url: "{{baseUrl}}/v1/languages"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 304 Response
    description: The caller's ETag is current
    request:
      url: "{{baseUrl}}/v1/languages"
      method: GET
    response:
      status: 304
      statusText: Not Modified
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "code": "",
              "name": ""
            }
          ]
  - name: 4XX Response
    description: Client error - a problem detail, except a 401/403 rejected by the security filter chain before reaching the application, which has no body
    request:
      url: "{{baseUrl}}/v1/languages"
      method: GET
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }
  - name: 5XX Response
    description: Unexpected server error
    request:
      url: "{{baseUrl}}/v1/languages"
      method: GET
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }

