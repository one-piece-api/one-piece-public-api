info:
  name: devilFruitList
  type: http
  seq: 1
  tags:
    - Devil_Fruits

http:
  method: GET
  url: "{{baseUrl}}/v1/:lang/devil-fruits"
  params:
    - name: lang
      value: ""
      type: path
    - name: page
      value: "0"
      type: query
      description: 0-based page, 0 when missing
      disabled: true
    - name: size
      value: "1"
      type: query
      description: "Page size: 20 when missing, at most 100"
      disabled: true
    - name: q
      value: ""
      type: query
      description: Text the name or the romaji contains, case-insensitive; 100 characters at most
      disabled: true
    - name: type
      value: ""
      type: query
      description: "Only the fruits of this type: its id or slug, an old slug included; an unknown type lists nothing"
      disabled: true
    - name: sort
      value: name,asc
      type: query
      description: name, romaji or publishedAt, then asc or desc; default name,asc
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

