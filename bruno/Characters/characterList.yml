info:
  name: characterList
  type: http
  seq: 1
  tags:
    - Characters

http:
  method: GET
  url: "{{baseUrl}}/v1/:lang/characters"
  params:
    - name: lang
      value: ""
      type: path
    - name: page
      value: "0"
      type: query
      description: 0-based page, 0 when missing
      disabled: true
    - name: size
      value: "1"
      type: query
      description: "Page size: 20 when missing, at most 100"
      disabled: true
    - name: q
      value: ""
      type: query
      description: Text the name or the romaji or number contains, case-insensitive; 100 characters at most
      disabled: true
    - name: status
      value: ALIVE
      type: query
      description: Only the characters of this status
      disabled: true
    - name: status
      value: DECEASED
      type: query
      description: Only the characters of this status
      disabled: true
    - name: status
      value: UNKNOWN
      type: query
      description: Only the characters of this status
      disabled: true
    - name: species
      value: ""
      type: query
      description: Only the characters of this species, by id or slug (current or old); an unknown species lists nothing
      disabled: true
    - name: affiliation
      value: ""
      type: query
      description: Only the characters that belong to this affiliation now, by id or slug (current or old); those who left it do not count; an unknown affiliation lists nothing
      disabled: true
    - name: affiliationKind
      value: PIRATE_CREW
      type: query
      description: Only the characters that belong now to an affiliation of this kind
      disabled: true
    - name: affiliationKind
      value: NAVY
      type: query
      description: Only the characters that belong now to an affiliation of this kind
      disabled: true
    - name: affiliationKind
      value: WORLD_GOVERNMENT
      type: query
      description: Only the characters that belong now to an affiliation of this kind
      disabled: true
    - name: affiliationKind
      value: REVOLUTIONARY_ARMY
      type: query
      description: Only the characters that belong now to an affiliation of this kind
      disabled: true
    - name: affiliationKind
      value: OTHER
      type: query
      description: Only the characters that belong now to an affiliation of this kind
      disabled: true
    - name: devilFruit
      value: ""
      type: query
      description: Only the characters that have this Devil Fruit, now or once, by id or slug (current or old); an unknown fruit lists nothing
      disabled: true
    - name: sort
      value: name,asc
      type: query
      description: name, romaji or publishedAt, then asc or desc; default name,asc
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

