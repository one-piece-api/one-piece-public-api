info:
  name: chapterList
  type: http
  seq: 1
  tags:
    - Chapters

http:
  method: GET
  url: "{{baseUrl}}/v1/:lang/chapters"
  params:
    - name: lang
      value: ""
      type: path
    - name: page
      value: "0"
      type: query
      description: 0-based page, 0 when missing
      disabled: true
    - name: size
      value: "1"
      type: query
      description: "Page size: 20 when missing, at most 100"
      disabled: true
    - name: q
      value: ""
      type: query
      description: Text the name or the romaji or number contains, case-insensitive; 100 characters at most
      disabled: true
    - name: asOfChapter
      value: "0"
      type: query
      description: "Spoiler filter: the last chapter read, inclusive. What the reader meets after it is left out of lists, searches and counts, and its detail answers 404. Missing: nothing is hidden"
      disabled: true
    - name: arc
      value: ""
      type: query
      description: "Only the chapters of this arc: its id or number, an old slug included; an unknown arc lists nothing"
      disabled: true
    - name: volume
      value: ""
      type: query
      description: "Only the chapters of this volume: its id or number, an old slug included; an unknown volume lists nothing"
      disabled: true
    - name: sort
      value: number,asc
      type: query
      description: name, number or publishedAt, then asc or desc; default number,asc
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

