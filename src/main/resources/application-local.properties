# Runs outside the cluster (e.g. from IntelliJ, for debugging): the shared PostgreSQL
# instance still runs in the kind cluster, reached via `kubectl port-forward`. Values below
# are local-only placeholders, safe to hardcode, never real secrets.

# Next to user-service (8081) and content-service (8082); actuator one port further.
server.port=8083
management.server.port=8093

# kubectl port-forward svc/one-piece-postgresql -n data 5433:5432
spring.datasource.url=jdbc:postgresql://localhost:5433/content_service
spring.datasource.password=public-api-reader-db-change-me-locally
