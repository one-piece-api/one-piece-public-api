spring.application.name=public-api

# "local" (this service running outside the cluster, e.g. from IntelliJ) is the default so a
# plain run needs no extra setup; the Helm chart sets "dev" for the pod in the cluster. Same
# convention as the other services.
spring.profiles.active=local

# No context path: the gateway strips "/api/public" before forwarding (plan D10), so moving
# the API to its own host later changes only the route, never this service.

# Actuator on its own port, never reached by the public route: the probes need it, the
# Internet does not.
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Not ready while the database cannot be reached: without it this service has nothing to say.
management.endpoint.health.group.readiness.include=readinessState,db

# The read-only role onepiece-infrastructure creates on content_service (its ADR-0018): it
# may read the "published" schema and nothing else. Host and password differ per profile.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=public_api_reader
spring.datasource.hikari.read-only=true
# Two pods (a rolling update) must fit in the role's CONNECTION LIMIT of 10 (plan D11).
spring.datasource.hikari.maximum-pool-size=5
