# This service runs as a pod inside the kind cluster: the shared PostgreSQL instance is
# reached via cluster-internal Service DNS. The password arrives as an env var injected by
# the Helm chart from the one-piece-public-api-db-credentials Secret.
spring.datasource.url=jdbc:postgresql://one-piece-postgresql.data.svc.cluster.local:5432/content_service
spring.datasource.password=${PUBLIC_API_POSTGRESQL_PASSWORD}
