# Test-only additions to the application's own properties (Spring Boot reads config/ next to,
# and on top of, the classpath root - the main application.properties stays in effect).

# content-service's migrations grant the "published" schema to public_api_reader, which
# onepiece-infrastructure creates in the cluster. A test database is new each time: create
# the role first, able to log in as this service does. No comma in the statement - this
# property is a comma-separated list.
spring.flyway.init-sqls=DO $$BEGIN CREATE ROLE public_api_reader LOGIN PASSWORD 'reader-test'; EXCEPTION WHEN duplicate_object THEN NULL; END$$
