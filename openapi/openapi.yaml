        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Only the bounties of this validity, derived from the bounties\
          \ online"
        in: query
        name: validity
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUPERSEDED
          - INACTIVE
      - description: Only the bounties of this condition
        in: query
        name: condition
        required: false
        schema:
          type: string
          enum:
          - DEAD_OR_ALIVE
          - ONLY_ALIVE
      - description: "Only the bounties of this character, by id or slug (current\
          \ or old); an unknown character lists nothing"
        in: query
        name: holder
        required: false
        schema:
          type: string
      - description: "amount, name (poster name, then amount) or publishedAt, then\
          \ asc or desc; default amount,desc"
        in: query
        name: sort
        schema:
          type: string
          example: "amount,desc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseBountySummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Bounties
  /v1/{lang}/bounties/{idOrSlug}:
