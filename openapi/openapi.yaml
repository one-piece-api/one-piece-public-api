openapi: 3.1.0
info:
  title: public-api
  version: v1
servers:
- url: /
paths:
  /v1:
    get:
      description: "The entry point: where the other parts of the API are"
      operationId: indexIndex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Index
  /v1/images/{id}.png:
    get:
      description: "An image of a content online, by the id its content gives"
      operationId: imageGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Images
  /v1/languages:
    get:
      description: The languages the content is available in
      operationId: languageList
      responses:
        "304":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
  /v1/{lang}/arcs:
    get:
      description: "Lists the arcs online, one page at a time"
      operationId: arcList
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - description: "0-based page, 0 when missing"
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: "Page size: 20 when missing, at most 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Only the arcs of this saga: its id or number, an old slug included;\
          \ an unknown saga lists nothing"
        in: query
        name: saga
        required: false
        schema:
          type: string
      - description: "name, number or publishedAt, then asc or desc; default number,asc"
        in: query
        name: sort
        schema:
          type: string
          example: "number,asc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseArcSummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Arcs
  /v1/{lang}/arcs/{idOrSlug}:
    get:
      description: "One arc by id or number, with its saga and what its chapters and\
        \ episodes amount to"
      operationId: arcGet
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - in: path
        name: idOrSlug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcResponse"
          description: OK
        "301":
          description: "An old slug: Location is the current slug, relative to this\
            \ address"
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Arcs
  /v1/{lang}/chapters:
    get:
      description: "Lists the chapters online, one page at a time"
      operationId: chapterList
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - description: "0-based page, 0 when missing"
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: "Page size: 20 when missing, at most 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Only the chapters of this arc: its id or number, an old slug\
          \ included; an unknown arc lists nothing"
        in: query
        name: arc
        required: false
        schema:
          type: string
      - description: "Only the chapters of this volume: its id or number, an old slug\
          \ included; an unknown volume lists nothing"
        in: query
        name: volume
        required: false
        schema:
          type: string
      - description: "name, number or publishedAt, then asc or desc; default number,asc"
        in: query
        name: sort
        schema:
          type: string
          example: "number,asc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseChapterSummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Chapters
  /v1/{lang}/chapters/{idOrSlug}:
    get:
      description: "One chapter by id or number, with its arc, volume and release\
        \ days"
      operationId: chapterGet
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - in: path
        name: idOrSlug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
