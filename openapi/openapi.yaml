components:
  responses:
    ClientError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: "Client error - a problem detail, except a 401/403 rejected by\
        \ the security filter chain before reaching the application, which has no\
        \ body"
    ServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: Unexpected server error
  schemas:
    ArcReferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
        slug:
          type: string
        title:
          type: string
    ArcResponse:
      type: object
      properties:
        chapters:
          $ref: "#/components/schemas/StorySpanResponse"
        description:
          type: string
        episodes:
          $ref: "#/components/schemas/StorySpanResponse"
        id:
          type: string
          format: uuid
        language:
          type: string
        number:
          type: integer
          format: int32
        publishedAt:
          type: string
          format: date-time
        saga:
          $ref: "#/components/schemas/SagaSummaryResponse"
        slug:
          type: string
        title:
          type: string
    ArcSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
        saga:
          $ref: "#/components/schemas/SagaSummaryResponse"
        slug:
          type: string
        title:
          type: string
    ChapterReferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
        slug:
          type: string
        title:
          type: string
    ChapterResponse:
      type: object
      properties:
        arc:
          $ref: "#/components/schemas/ArcReferenceResponse"
        description:
          type: string
        id:
          type: string
          format: uuid
        japaneseTitle:
          type: string
        language:
          type: string
        number:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int32
        publishedAt:
          type: string
          format: date-time
        releases:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseResponse"
        slug:
          type: string
        title:
          type: string
        volume:
          $ref: "#/components/schemas/VolumeSummaryResponse"
    ChapterSummaryResponse:
      type: object
      properties:
        arc:
          $ref: "#/components/schemas/ArcReferenceResponse"
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
        slug:
          type: string
        title:
          type: string
        volume:
          $ref: "#/components/schemas/VolumeSummaryResponse"
    DevilFruitOfTypeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image:
          type: string
        name:
          type: string
        romaji:
          type: string
        slug:
          type: string
    DevilFruitResponse:
      type: object
      properties:
        advantages:
          type: string
        description:
          type: string
        disadvantages:
          type: string
        firstAppearance:
          $ref: "#/components/schemas/FirstAppearanceResponse"
        id:
          type: string
          format: uuid
        image:
          type: string
        language:
          type: string
        name:
          type: string
        publishedAt:
          type: string
          format: date-time
        romaji:
          type: string
        slug:
          type: string
        subcategory:
          $ref: "#/components/schemas/DevilFruitSubcategoryReferenceResponse"
        type:
          $ref: "#/components/schemas/DevilFruitTypeReferenceResponse"
    DevilFruitSubcategoryReferenceResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    DevilFruitSubcategoryResponse:
      type: object
      properties:
        description:
          type: string
        firstAppearance:
          $ref: "#/components/schemas/FirstAppearanceResponse"
        id:
          type: string
          format: uuid
        name:
          type: string
    DevilFruitSubcategorySummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DevilFruitSummaryResponse:
      type: object
      properties:
        firstAppearance:
          $ref: "#/components/schemas/FirstAppearanceResponse"
        id:
          type: string
          format: uuid
        image:
          type: string
        name:
          type: string
        romaji:
          type: string
        slug:
          type: string
