      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Only the episodes of this arc: its id or number, an old slug\
          \ included; an unknown arc lists nothing"
        in: query
        name: arc
        required: false
        schema:
          type: string
      - description: "name, number or publishedAt, then asc or desc; default number,asc"
        in: query
        name: sort
        schema:
          type: string
          example: "number,asc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseEpisodeSummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Episodes
  /v1/{lang}/episodes/{idOrSlug}:
    get:
      description: "One episode by id or number, with its arc and broadcast days"
      operationId: episodeGet
      parameters:
      - in: path
        name: lang
        required: true
        schema:
