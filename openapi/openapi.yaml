        in: query
        name: species
        required: false
        schema:
          type: string
      - description: "Only the characters that belong to this affiliation now, by\
          \ id or slug (current or old); those who left it do not count; an unknown\
          \ affiliation lists nothing"
        in: query
        name: affiliation
        required: false
        schema:
          type: string
      - description: Only the characters that belong now to an affiliation of this
          kind
        in: query
        name: affiliationKind
        required: false
        schema:
          type: string
          enum:
          - PIRATE_CREW
          - NAVY
          - WORLD_GOVERNMENT
          - REVOLUTIONARY_ARMY
          - OTHER
      - description: "Only the characters that have this Devil Fruit now, by id or\
          \ slug (current or old); those who lost its power do not count; an unknown\
          \ fruit lists nothing"
        in: query
        name: devilFruit
        required: false
        schema:
          type: string
      - description: "name, romaji or publishedAt, then asc or desc; default name,asc"
