          format: int32
          minimum: 1
      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Spoiler filter: the last chapter read, inclusive. What the reader\
          \ meets after it is left out of lists, searches and counts, and its detail\
          \ answers 404. Missing: nothing is hidden"
        in: query
        name: asOfChapter
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: "name, romaji or publishedAt, then asc or desc; default name,asc"
        in: query
        name: sort
        schema:
          type: string
          example: "name,asc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDevilFruitTypeSummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
  /v1/{lang}/devil-fruit-types/{idOrSlug}:
    get:
      description: One Devil Fruit Type by id or slug
      operationId: devilFruitTypeGet
      parameters:
      - in: path
        name: lang
