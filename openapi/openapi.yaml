          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Chapters
  /v1/{lang}/devil-fruit-types:
    get:
      description: "Lists the Devil Fruit Types online, one page at a time"
