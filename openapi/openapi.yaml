openapi: 3.1.0
info:
  title: public-api
  version: v1
servers:
- url: /
paths:
  /v1:
    get:
      description: "The entry point: where the other parts of the API are"
      operationId: indexIndex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Index
  /v1/images/{id}:
    get:
      description: "An image of a content online, by the id its content gives"
      operationId: imageGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Images
  /v1/languages:
    get:
      description: The languages the content is available in
      operationId: languageList
      responses:
        "304":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
  /v1/{lang}/affiliations:
    get:
      description: "Lists the affiliations online, one page at a time"
      operationId: affiliationList
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - description: "0-based page, 0 when missing"
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: "Page size: 20 when missing, at most 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - description: "Text the name or the romaji or number contains, case-insensitive;\
          \ 100 characters at most"
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: Only the affiliations of this kind
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - PIRATE_CREW
          - NAVY
          - WORLD_GOVERNMENT
          - REVOLUTIONARY_ARMY
          - OTHER
      - description: "name, romaji or publishedAt, then asc or desc; default name,asc"
        in: query
        name: sort
        schema:
          type: string
          example: "name,asc"
      responses:
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAffiliationSummaryResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Affiliations
  /v1/{lang}/affiliations/{idOrSlug}:
    get:
      description: One affiliation by id or slug
      operationId: affiliationGet
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - in: path
        name: idOrSlug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationResponse"
          description: OK
        "301":
          description: "An old slug: Location is the current slug, relative to this\
            \ address"
        "304":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationResponse"
          description: The caller's ETag is current
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Affiliations
